
<script type="module">
const $ = id => document.getElementById(id);
const safe = value => String(value ?? "");
const entries = data => Object.entries(data || {}).map(([id,value])=>({id,...(value || {})}));
const escapeHTML = value => safe(value).replace(/[&<>"']/g,char=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[char]));

let dbReady=false;
let demoMode=true;
let addData=null;
let updateData=null;
let firebaseListeners=[];

let pulseData={};
let queryData={};
let suggestionData={};
let pollData={};
let controlData={};
let messageData={};

/* --------------------------------------------------
   REALISTIC CLASSROOM DEMONSTRATION DATA

   Total enrolled: 80
   Present: 68
   Absent: 12
   Pulse responses: 56
   Present without response: 12

   Clear: 31
   Partial: 17
   Need help: 8
-------------------------------------------------- */

const CLASSROOM = {
 enrolled:80,
 present:68,
 absent:12,
 pulseResponses:56,
 noPulseResponse:12,
 clear:31,
 partial:17,
 confused:8,
 pollResponses:56,
 pollNoResponse:12
};

function makeDemoData(){
 const pulses={};
 const queries={};
 const suggestions={};
 const polls={};
 const controls={};

 let counter=1;

 function studentId(n){
  return "LC-"+String(n).padStart(6,"0");
 }

 const pulseTypes=[
  ...Array(31).fill("Clear"),
  ...Array(17).fill("Partial"),
  ...Array(8).fill("Confused")
 ];

 pulseTypes.forEach((response,index)=>{
  const id=studentId(index+1);
  pulses["pulse_"+counter]={
   anonymousId:id,
   response,
   createdAt:Date.now()-(56-index)*60000
  };
  counter++;
 });

 // Demonstration doubts: 36 submitted doubt records.
 const doubtExamples=[
  ["Differentiation","Why does the chain rule require multiplying by the derivative of the inner function?"],
  ["Differentiation","I understand the formula but how do I identify the inner function?"],
  ["Integration","How do we decide which integration method to use?"],
  ["Calculus","Can you explain the difference between differentiation and integration?"],
  ["Limits","Why does direct substitution sometimes give an undefined answer?"],
  ["Differentiation","Please solve one chain rule numerical step by step."],
  ["Functions","How do we identify the domain of a composite function?"],
  ["Integration","What is the logic behind integration by parts?"],
  ["Limits","Can you explain L'Hopital's rule with an example?"],
  ["Calculus","How can I avoid sign errors in differentiation?"],
  ["Differentiation","What happens if the inner function is a trigonometric function?"],
  ["Integration","How do we solve definite integration questions?"]
 ];

 for(let i=0;i<36;i++){
  const item=doubtExamples[i%doubtExamples.length];
  const id=studentId((i%56)+1);
  queries["doubt_"+(i+1)]={
   anonymousId:id,
   topic:item[0],
   question:item[1],
   message:item[1],
   createdAt:Date.now()-i*90000,
   status:i<9?"Answered":"Pending",
   answer:i<9?"Please review the relevant class example and practise the same steps.": ""
  };
 }

 // Demonstration resource requests: 42 records.
 const resourceTypes=[
  "Revision notes","Revision notes","Revision notes",
  "Practice worksheet","Practice worksheet",
  "Re-lecture","Re-lecture",
  "Practice test","Solved examples"
 ];

 const resourceCounts={
  "Revision notes":18,
  "Practice worksheet":12,
  "Re-lecture":8,
  "Practice test":3,
  "Solved examples":1
 };

 let suggestionNumber=1;
 Object.entries(resourceCounts).forEach(([type,count])=>{
  for(let i=0;i<count;i++){
   suggestions["suggestion_"+suggestionNumber]={
    anonymousId:studentId(((suggestionNumber-1)%56)+1),
    type,
    category:type,
    topic:i%2===0?"Differentiation":"Integration",
    message:`I would like ${type.toLowerCase()} for ${i%2===0?"Differentiation":"Integration"}.`,
    createdAt:Date.now()-suggestionNumber*70000
   };
   suggestionNumber++;
  }
 });

 const options=[
  "Fully understood",
  "Partially understood",
  "Need another explanation"
 ];

 polls["demo_poll_1"]={
  topic:"Today's Calculus Lecture",
  question:"How well did you understand today's topic?",
  description:"Illustrative classroom understanding poll.",
  options,
  status:"Active",
  active:true,
  totalVotes:56,
  voteCounts:{
   "Fully understood":30,
   "Partially understood":20,
   "Need another explanation":6
  },
  createdAt:Date.now()-3600000
 };

 polls["demo_poll_2"]={
  topic:"Differentiation Practice",
  question:"How confident are you about solving differentiation questions?",
  description:"Illustrative follow-up poll.",
  options:[
   "Very confident",
   "Somewhat confident",
   "Need more practice"
  ],
  status:"Closed",
  active:false,
  totalVotes:52,
  voteCounts:{
   "Very confident":21,
   "Somewhat confident":19,
   "Need more practice":12
  },
  createdAt:Date.now()-7200000
 };

 controls[studentId(8)]={
  frozen:false,
  updatedAt:Date.now()
 };

 return {pulses,queries,suggestions,polls,controls};
}

function loadDemoData(){
 const demo=makeDemoData();
 pulseData=demo.pulses;
 queryData=demo.queries;
 suggestionData=demo.suggestions;
 pollData=demo.polls;
 controlData=demo.controls;
}

function setConnection(ok){
 dbReady=ok;
 demoMode=!ok;
 $("connectionStatus").textContent=ok?"FIREBASE CONNECTED":"DEMO DATA";
 $("connectionStatus").style.color=ok?"var(--green)":"var(--yellow)";
}

function showSection(id,button){
 document.querySelectorAll(".content").forEach(s=>s.classList.remove("active"));
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
 $(id).classList.add("active");
 button.classList.add("active");
}
window.showSection=showSection;

// ---------- ATTENDANCE AND PULSE HELPERS ----------

function getStudentId(item){
 return safe(item.anonymousId || item.studentId || item.studentID || item.id);
}

function getPulseStatus(item){
 const raw=safe(item.response || item.understanding || item.pulse || "").toLowerCase();
 if(["clear","understood","yes","fully understood"].includes(raw))return "Clear";
 if(["partial","partially clear","partially understood","somewhat"].includes(raw))return "Partial";
 if(["confused","need help","not understood","no"].includes(raw))return "Confused";
 return "Unknown";
}

function latestPulseByStudent(){
 const latest={};
 entries(pulseData).forEach(item=>{
  const id=getStudentId(item);
  if(!id)return;
  const time=Number(item.createdAt || item.timestamp || 0);
  if(!latest[id] || time>=latest[id].time){
   latest[id]={...item,studentId:id,time};
  }
 });
 return Object.values(latest);
}

function countStatuses(){
 const list=latestPulseByStudent();
 return {
  total:list.length,
  clear:list.filter(x=>getPulseStatus(x)==="Clear").length,
  partial:list.filter(x=>getPulseStatus(x)==="Partial").length,
  confused:list.filter(x=>getPulseStatus(x)==="Confused").length,
  unknown:list.filter(x=>getPulseStatus(x)==="Unknown").length
 };
}

function isAnswered(item){
 return !!(item.answer || item.teacherReply || item.status==="Answered");
}

function isFrozen(id){
 const item=controlData[id] || {};
 if(!item.frozen)return false;
 const until=Number(item.frozenUntil || 0);
 if(until && Date.now()>until)return false;
 return true;
}

function formatCountBar(label,count,total,color){
 const pct=total?Math.round(count/total*100):0;
 return `<div class="bar-row"><span>${label}</span><b>${count} (${pct}%)</b></div>
 <div class="bar"><div class="fill ${color}" style="width:${pct}%"></div></div>`;
}

function recommendation(title,body){
 return `<div class="insight"><h4>${title}</h4><p>${body}</p></div>`;
}

// ---------- OVERVIEW ----------

function renderOverview(){
 const c=countStatuses();
 const polls=entries(pollData);
 const active=polls.filter(p=>p.status==="Active" || p.active===true);
 const doubts=entries(queryData);
 const suggestions=entries(suggestionData);
 const pending=doubts.filter(q=>!isAnswered(q));
 const frozen=Object.keys(controlData).filter(id=>isFrozen(id)).length;

 $("ovTotal").textContent=c.total;
 $("ovPolls").textContent=active.length;
 $("ovDoubts").textContent=pending.length;
 $("ovSuggestions").textContent=suggestions.length;

 $("attentionDoubts").textContent=pending.length;
 $("attentionFlags").textContent=flaggedQuestionList().length;
 $("attentionFrozen").textContent=frozen;
 $("attentionSuggestions").textContent=suggestions.length;

 const attendanceRate=Math.round(CLASSROOM.present/CLASSROOM.enrolled*100);
 const responseRate=Math.round(c.total/CLASSROOM.present*100);

 $("overviewPulse").innerHTML=
  `<div class="notice info">
   <b>Demonstration classroom: 80 enrolled students</b><br>
   Present: ${CLASSROOM.present} | Absent: ${CLASSROOM.absent}<br>
   Pulse responses: ${c.total} | Present without response: ${CLASSROOM.present-c.total}<br>
   Attendance rate: ${attendanceRate}% | Response rate among attendees: ${responseRate}%
  </div>`+
  formatCountBar("🟢 Clear",c.clear,c.total,"green")+
  formatCountBar("🟡 Partially clear",c.partial,c.total,"yellow")+
  formatCountBar("🔴 Need help",c.confused,c.total,"red");

 const latest=active.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];

 if(latest){
  $("overviewPoll").innerHTML=
   `<div class="card">
    <h4>${escapeHTML(latest.topic || "Classroom poll")}</h4>
    <p>${escapeHTML(latest.question || "")}</p>
    <span class="badge green-b">LIVE</span>
    <p style="margin-top:10px">Recorded votes: ${Number(latest.totalVotes||0)}</p>
   </div>`;
 }else{
  $("overviewPoll").innerHTML='<p class="empty">No active poll. Publish one from Poll Management.</p>';
 }

 const groups=suggestionGroups();
 const top=Object.entries(groups).sort((a,b)=>b[1]-a[1])[0];

 $("overviewSuggestions").innerHTML=top?
  `<div class="card"><h4>${escapeHTML(top[0])}</h4><p>${top[1]} of ${suggestions.length} submitted requests</p></div>`:
  '<p class="empty">No suggestions received yet.</p>';

 const insight=buildTeachingRecommendation(c);
 $("overviewRecommendation").innerHTML=`<h4>${insight.title}</h4><p>${insight.body}</p>`;
}

// ---------- POLLS ----------

function createPollRecord(topic,question,description,options){
 const poll={
  topic,question,description,options,
  status:"Active",active:true,totalVotes:0,
  voteCounts:{},createdAt:Date.now()
 };

 if(dbReady){
  addData("teacherPolls",poll).then(()=>{
   $("pollMessage").textContent="Poll published successfully.";
   $("pollMessage").style.color="var(--green)";
  }).catch(err=>{
   console.error(err);
   alert("Could not publish poll. Check Firebase permissions.");
  });
 }else{
  const id="local_poll_"+Date.now();
  pollData[id]=poll;
  refreshAll();
  $("pollMessage").textContent="Demo poll created locally. It is not visible on other devices.";
  $("pollMessage").style.color="var(--yellow)";
 }
}

window.createPoll=function(){
 const topic=$("pollTopic").value.trim();
 const question=$("pollQuestion").value.trim();
 const description=$("pollDescription").value.trim();
 const options=["pollOption1","pollOption2","pollOption3","pollOption4"]
  .map(id=>$(id).value.trim()).filter(Boolean);

 if(!topic || !question || options.length<2){
  $("pollMessage").textContent="Enter a topic, a question, and at least two options.";
  $("pollMessage").style.color="var(--red)";
  return;
 }

 createPollRecord(topic,question,description,options);
 ["pollTopic","pollQuestion","pollDescription","pollOption1","pollOption2","pollOption3","pollOption4"].forEach(id=>$(id).value="");
};

function renderPolls(){
 const list=entries(pollData).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 $("pollList").innerHTML="";

 if(!list.length){
  $("pollList").innerHTML='<p class="empty">No polls available.</p>';
  return;
 }

 list.forEach(p=>{
  const card=document.createElement("div");
  card.className="card";

  const title=document.createElement("h4");
  title.textContent=p.topic || "Classroom poll";

  const question=document.createElement("p");
  question.textContent=p.question || "";

  const state=document.createElement("span");
  state.className="badge "+(p.status==="Active"?"green-b":"");
  state.textContent=p.status || "Unknown";

  const vote=document.createElement("p");
  vote.textContent="Recorded votes: "+Number(p.totalVotes||0);

  const actions=document.createElement("div");
  actions.className="card-actions";

  const toggle=document.createElement("button");
  toggle.className="secondary-btn";
  toggle.textContent=p.status==="Active"?"Close Poll":"Publish / Reopen";
  toggle.onclick=()=>changePollStatus(p.id,p.status==="Active"?"Closed":"Active");

  actions.append(toggle);
  card.append(title,question,state,vote,actions);
  $("pollList").append(card);
 });
}

async function changePollStatus(id,status){
 if(dbReady){
  try{
   await updateData("teacherPolls/"+id,{status,active:status==="Active"});
  }catch(e){
   console.error(e);
   alert("Could not update poll status.");
  }
 }else{
  if(pollData[id]){
   pollData[id].status=status;
   pollData[id].active=status==="Active";
   refreshAll();
  }
 }
}

function renderAnalyticsPollSelect(){
 const select=$("analyticsPollSelect");
 const previous=select.value;
 select.innerHTML='<option value="">Select a poll</option>';

 entries(pollData).forEach(p=>{
  const option=document.createElement("option");
  option.value=p.id;
  option.textContent=(p.topic||"Poll")+" — "+(p.question||"");
  select.append(option);
 });

 if(previous && pollData[previous])select.value=previous;
 renderAnalyticsPoll();
}

window.renderAnalyticsPoll=function(){
 const id=$("analyticsPollSelect").value;
 const p=pollData[id];
 const container=$("analyticsPollResults");

 if(!p){
  container.innerHTML='<p class="empty">Select a poll to view its results.</p>';
  return;
 }

 const counts=p.voteCounts || p.results || {};
 const total=Number(p.totalVotes || Object.values(counts).reduce((a,b)=>a+Number(b||0),0));

 let html=`<p class="sub">${total} recorded votes. Results are based only on students who voted.</p>`;

 (p.options||[]).forEach(option=>{
  const count=Number(counts[option]||0);
  html+=formatCountBar(escapeHTML(option),count,total,"blue");
 });

 if(!total)html+='<p class="empty">No votes have been recorded yet.</p>';

 container.innerHTML=html;
};

// ---------- ANALYTICS ----------

function buildTeachingRecommendation(c){
 if(!c.total){
  return {
   title:"Waiting for participation",
   body:"Encourage students to submit their understanding pulse."
  };
 }

 const confused=Math.round(c.confused/c.total*100);
 const partial=Math.round(c.partial/c.total*100);
 const needsSupport=c.confused+c.partial;
 const supportRate=Math.round(needsSupport/c.total*100);

 if(confused>=25){
  return {
   title:"High confusion detected",
   body:`${c.confused} of ${c.total} responses indicate that students need help. Re-explain the topic using a simpler example, solve one problem step by step, and conduct a follow-up poll.`
  };
 }

 if(supportRate>=40){
  return {
   title:"A substantial group needs reinforcement",
   body:`${needsSupport} of ${c.total} responses (${supportRate}%) are partially clear or need help. Consider revisiting the difficult steps before moving to the next topic.`
  };
 }

 if(partial>=25){
  return {
   title:"Many students need reinforcement",
   body:"Show another worked example and give students a short practice exercise before moving forward."
  };
 }

 return {
  title:"Class understanding looks encouraging",
  body:`${c.clear} of ${c.total} responses indicate clear understanding. Continue with the planned lesson while providing extra support to students who requested it.`
 };
}

function renderAnalytics(){
 const c=countStatuses();

 $("anParticipated").textContent=c.total;
 $("anClear").textContent=c.clear;
 $("anPartial").textContent=c.partial;
 $("anConfused").textContent=c.confused;

 $("analyticsPulse").innerHTML=
  `<div class="notice info">
   <b>Classroom attendance</b><br>
   ${CLASSROOM.present} present / ${CLASSROOM.enrolled} enrolled<br>
   ${CLASSROOM.absent} absent. ${CLASSROOM.present-c.total} present students did not submit a pulse.
  </div>`+
  formatCountBar("Clear",c.clear,c.total,"green")+
  formatCountBar("Partially clear",c.partial,c.total,"yellow")+
  formatCountBar("Need help",c.confused,c.total,"red");

 const insight=buildTeachingRecommendation(c);
 $("analyticsRecommendation").innerHTML=`<h4>${insight.title}</h4><p>${insight.body}</p>`;

 renderStudentControls();
 renderAnalyticsPollSelect();
}

function renderStudentControls(){
 const search=$("studentIdSearch").value.trim().toLowerCase();
 const students=latestPulseByStudent();
 const ids=new Set(students.map(s=>s.studentId));

 Object.keys(controlData).forEach(id=>ids.add(id));

 const filtered=[...ids].filter(id=>id.toLowerCase().includes(search)).sort();
 const body=$("studentControlTable");
 body.innerHTML="";

 if(!filtered.length){
  body.innerHTML='<tr><td colspan="4" class="empty">No matching anonymous IDs.</td></tr>';
  return;
 }

 filtered.forEach(id=>{
  const record=students.find(s=>s.studentId===id);
  const frozen=isFrozen(id);

  const tr=document.createElement("tr");
  const idCell=document.createElement("td");
  idCell.textContent=id;

  const response=document.createElement("td");
  response.textContent=record?getPulseStatus(record):"No pulse";

  const status=document.createElement("td");
  status.innerHTML=frozen?
   '<span class="badge red-b">Frozen</span>':
   '<span class="badge green-b">Active</span>';

  const action=document.createElement("td");
  const button=document.createElement("button");
  button.className=frozen?"success-btn":"danger-btn";
  button.textContent=frozen?"Unfreeze":"Freeze";
  button.onclick=()=>setStudentFreeze(id,!frozen);

  action.append(button);
  tr.append(idCell,response,status,action);
  body.append(tr);
 });
}

async function setStudentFreeze(id,freeze){
 const record={
  frozen:freeze,
  frozenUntil:freeze?Date.now()+24*60*60*1000:0,
  updatedAt:Date.now(),
  reason:freeze?"Teacher moderation action":"Teacher lifted restriction"
 };

 if(dbReady){
  try{
   await updateData("studentControls/"+id,record);
   alert(freeze?"Student ID frozen for 24 hours.":"Student ID unfrozen.");
  }catch(e){
   console.error(e);
   alert("Could not update student control.");
  }
 }else{
  controlData[id]=record;
  renderStudentControls();
  alert("Demo mode: restriction updated only in this browser session.");
 }
}

// ---------- DOUBTS ----------

function questionText(q){
 return safe(q.question || q.message || q.doubt || q.text);
}

function questionTopic(q){
 return safe(q.topic || q.category || "General question");
}

function flaggedQuestionList(){
 const qs=entries(queryData);
 const normalized=qs.map(q=>({
  ...q,
  text:questionText(q).toLowerCase().replace(/[^a-z0-9 ]/g," ").trim()
 }));

 const counts={};
 normalized.forEach(q=>{
  if(q.text)counts[q.text]=(counts[q.text]||0)+1;
 });

 return normalized.filter(q=>{
  const words=q.text.split(/\s+/).filter(Boolean);
  const looksDetailed=words.length>=14;
  const asksReason=/why|how|explain|derive|prove|relationship|difference|what happens if/.test(q.text);
  return q.text && counts[q.text]===1 && (looksDetailed||asksReason);
 });
}

function renderDoubts(){
 const qs=entries(queryData).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const pending=qs.filter(q=>!isAnswered(q));
 const answered=qs.length-pending.length;
 const flagged=flaggedQuestionList();

 $("doubtTotal").textContent=qs.length;
 $("doubtPending").textContent=pending.length;
 $("doubtAnswered").textContent=answered;
 $("doubtFlagged").textContent=flagged.length;

 renderQuestionCards(flagged,"flaggedQuestions",true);
 renderQuestionCards(qs,"doubtList",false);
}

function renderQuestionCards(items,target,flagged){
 const container=$(target);
 container.innerHTML="";

 if(!items.length){
  container.innerHTML='<p class="empty">No questions to display.</p>';
  return;
 }

 items.forEach(q=>{
  const card=document.createElement("div");
  card.className="card";

  const heading=document.createElement("h4");
  heading.textContent=questionTopic(q)+" • "+(getStudentId(q)||"Anonymous student");

  const question=document.createElement("p");
  question.textContent=questionText(q);

  const status=document.createElement("span");
  status.className="badge "+(isAnswered(q)?"green-b":"yellow-b");
  status.textContent=isAnswered(q)?"Answered":"Pending";

  const flag=document.createElement("span");
  flag.className="badge";
  flag.textContent=flagged?"Worth teacher review":"Student question";

  const answer=document.createElement("textarea");
  answer.placeholder="Write your explanation or solution...";
  answer.value=q.answer||q.teacherReply||"";

  const send=document.createElement("button");
  send.className="action-btn";
  send.textContent="Send Answer to Student";

  send.onclick=async()=>{
   if(!answer.value.trim())return alert("Write an answer first.");

   if(dbReady){
    try{
     await updateData("studentQueries/"+q.id,{
      answer:answer.value.trim(),
      status:"Answered",
      answeredAt:Date.now()
     });
     alert("Your answer has been saved.");
    }catch(e){
     console.error(e);
     alert("Could not save the answer.");
    }
   }else{
    queryData[q.id].answer=answer.value.trim();
    queryData[q.id].status="Answered";
    refreshAll();
    alert("Demo answer saved locally.");
   }
  };

  card.append(heading,question,status,flag,answer,send);
  container.append(card);
 });
}

// ---------- SUGGESTIONS ----------

function suggestionType(s){
 return safe(s.type||s.category||s.suggestion||s.resource||"Other").toLowerCase();
}

function suggestionGroups(){
 const groups={};

 entries(suggestionData).forEach(s=>{
  const raw=suggestionType(s);
  let group="Other";

  if(raw.includes("note"))group="Revision notes";
  else if(raw.includes("worksheet"))group="Worksheets";
  else if(raw.includes("lecture")||raw.includes("relecture"))group="Re-lecture";
  else if(raw.includes("test")||raw.includes("quiz"))group="Practice tests";
  else if(raw.includes("example"))group="Solved examples";
  else if(raw.includes("revision"))group="Revision";

  groups[group]=(groups[group]||0)+1;
 });

 return groups;
}

function renderSuggestions(){
 const list=entries(suggestionData);
 const groups=suggestionGroups();
 const total=list.length;

 $("suggestionTotal").textContent=total;
 $("suggestionNotes").textContent=(groups["Revision notes"]||0)+(groups["Revision"]||0);
 $("suggestionWorksheets").textContent=groups["Worksheets"]||0;
 $("suggestionRelecture").textContent=groups["Re-lecture"]||0;

 const chart=$("suggestionChart");
 chart.innerHTML="";

 const sorted=Object.entries(groups).sort((a,b)=>b[1]-a[1]);

 if(!sorted.length){
  chart.innerHTML='<p class="empty">No suggestions received yet.</p>';
 }

 sorted.forEach(([name,count])=>{
  const wrapper=document.createElement("div");
  wrapper.innerHTML=formatCountBar(escapeHTML(name),count,total,"purple");
  chart.append(wrapper);
 });

 const top=sorted[0];
 let insight;

 if(!top){
  insight={
   title:"Waiting for student suggestions",
   body:"Invite students to request notes, re-lectures, worksheets, or practice tests."
  };
 }else{
  const actions={
   "Revision notes":"Prepare a concise revision sheet and share it before the next class.",
   "Worksheets":"Create a topic-specific worksheet with basic, intermediate, and challenging questions.",
   "Re-lecture":"Plan a short revision session and ask students which step needs further explanation.",
   "Practice tests":"Prepare a short topic-based quiz.",
   "Solved examples":"Share worked examples and explain the reasoning behind each step.",
   "Revision":"Organise a focused revision session.",
   "Other":"Review the written requests and identify the most useful resource."
  };

  insight={
   title:"Most requested: "+top[0],
   body:`${top[1]} of ${total} submitted requests fall into this category. Suggested next step: ${actions[top[0]]||actions.Other}`
  };
 }

 $("suggestionRecommendation").innerHTML=`<h4>${insight.title}</h4><p>${insight.body}</p>`;

 const container=$("suggestionList");
 container.innerHTML="";

 if(!list.length){
  container.innerHTML='<p class="empty">No suggestions received yet.</p>';
  return;
 }

 list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(s=>{
  const card=document.createElement("div");
  card.className="card";

  const title=document.createElement("h4");
  title.textContent=s.topic||suggestionType(s)||"Student resource request";

  const details=document.createElement("p");
  details.textContent=s.message||s.description||s.request||s.suggestion||suggestionType(s);

  const id=document.createElement("p");
  id.textContent="Anonymous ID: "+(getStudentId(s)||"Not supplied");

  card.append(title,details,id);
  container.append(card);
 });
}

window.createResourcePoll=function(){
 const topic=$("resourceTopic").value.trim();
 const type=$("resourceType").value;

 if(!topic)return alert("Enter the topic for the resource poll.");

 const question=`Would you like ${type.toLowerCase()} for ${topic}?`;

 createPollRecord(topic,question,"Teacher-created resource demand poll.",[
  "Yes, I need it","Maybe, it would help","No, I do not need it"
 ]);

 $("resourceTopic").value="";
};

// ---------- REFRESH ----------

function refreshAll(){
 renderOverview();
 renderPolls();
 renderAnalytics();
 renderDoubts();
 renderSuggestions();
}

// ---------- FIREBASE CONNECTION ----------

async function connectFirebase(){
 try{
  const firebase=await import("./firebase.js");

  if(!firebase.listenData || !firebase.addData || !firebase.updateData){
   throw new Error("firebase.js must export listenData, addData and updateData.");
  }

  addData=firebase.addData;
  updateData=firebase.updateData;

  const paths=[
   ["studentPulse",data=>pulseData=data],
   ["studentQueries",data=>queryData=data],
   ["studentSuggestions",data=>suggestionData=data],
   ["teacherPolls",data=>pollData=data],
   ["studentControls",data=>controlData=data]
  ];

  paths.forEach(([path,callback])=>{
   firebase.listenData(path,data=>{
    callback(data||{});
    refreshAll();
   });
  });

  setConnection(true);
  refreshAll();

 }catch(error){
  console.warn("Firebase unavailable. Running demonstration mode.",error);
  loadDemoData();
  setConnection(false);
  refreshAll();
 }
}

loadDemoData();
setConnection(false);
refreshAll();
connectFirebase();

</script>
